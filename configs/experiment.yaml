# Experiment configuration.
#
# This file documents the settings these results were generated with. Values
# that constitute a PRE-REGISTERED RULE are marked; those were fixed before any
# test-set metric was inspected and must not be tuned after seeing results.

dataset:
  name: stocknet
  source: https://github.com/yumoxu/stocknet-dataset
  citation: >
    Xu & Cohen (2018). Stock Movement Prediction from Tweets and Historical
    Prices. ACL 2018.
  license: MIT
  download_size_mb: 580
  prepare: bash scripts/download_data.sh

  # Measured, not assumed -- see results/forecasting/panel_stats.json
  measured:
    tickers: 87
    sessions_per_ticker: 566
    session_range: [2014-01-02, 2016-04-01]
    panel_rows: 48838
    tweets_scored: 118600
    sessions_with_tweets_pct: 48.1

temporal_alignment:            # PRE-REGISTERED
  market_timezone: America/New_York
  market_close: "16:00"
  cutoff_rule: >
    A tweet at or before 16:00 ET on a trading session belongs to that
    session's information set. After the close it rolls to the next trading
    session. Weekends and holidays roll forward the same way.
  boundary: inclusive          # a tweet at exactly 16:00:00 counts as before
  trading_calendar: derived_from_observed_price_dates
  measured_pct_rolled_forward: 42.8

sentiment:
  training_corpus: data/raw/labeled_tweets.csv
  n_labeled: 5791
  preprocessing: src/sentiment/finance_text.py     # retained from original project
  candidates:
    - tfidf_multinomial_nb
    - tfidf_logistic_regression
    - tfidf_linear_svc_calibrated
  baseline: vader
  selection_rule: one_standard_error              # PRE-REGISTERED
  selection_detail: >
    Among models within 1 SE of the best 5-fold CV ROC-AUC on the TRAINING
    split, choose the least complex. Test split used for reporting only.
  selected: tfidf_logistic_regression
  refit_on: all_labeled_data

features:
  lags: [1, 2, 3, 5, 10]
  rolling_windows: [5, 10, 21]
  target_prefix: ret_fwd_       # structurally excluded from feature matrix
  horizons: [1, 3]
  sentiment_features:
    - sent_mean
    - sent_median
    - sent_std
    - pos_ratio
    - tweet_count
    - log_tweet_count
    - sent_mean_ma5
    - sent_chg
    - tweet_count_rel
  missing_sentiment: left_as_nan  # never imputed; XGBoost handles NaN natively

evaluation:
  scheme: expanding_window
  n_folds: 5
  min_train_fraction: 0.5
  purge_horizon_sessions: 1     # drops rows whose label resolves in the test block
  metrics: [rmse, mae, directional_accuracy]
  mape: price_level_only        # never on returns (near-zero denominator)
  significance:
    method: paired_bootstrap
    n_resamples: 2000
    alpha: 0.05

universes:
  primary:
    name: all tickers
    rule: all eligible tickers with >= 200 sessions in the overlap window
  high_coverage:                # PRE-REGISTERED
    rule: train-window coverage_rate >= 0.75 AND total training tweets >= 1000
    measured_on: training sessions only
    n_selected: 11

models:
  pooled_panel:
    estimator: xgboost
    arms: [market_only, market_plus_sentiment]
    ticker_identity: excluded
    ticker_identity_rationale: >
      All market features are already ticker-relative (returns, momentum,
      volatility, price position within trailing range, volume relative to
      its own trailing mean). Adding ticker dummies risks fitting
      train-period drift without adding cross-sectional information.
    inner_validation: last 20% of training sessions
    grid:
      - {max_depth: 3, learning_rate: 0.03, n_estimators: 300, min_child_weight: 20, reg_lambda: 2.0}
      - {max_depth: 4, learning_rate: 0.03, n_estimators: 400, min_child_weight: 50, reg_lambda: 5.0}
      - {max_depth: 2, learning_rate: 0.05, n_estimators: 300, min_child_weight: 10, reg_lambda: 1.0}

  per_ticker:
    estimators: [arima, prophet]
    n_tickers: 10
    selection_rule: sector_stratified            # PRE-REGISTERED
    selection_detail: >
      Within each sector, rank by TRAINING-window tweet volume, then take the
      top-ranked ticker from each sector round-robin until n. Ranking uses a
      property of the social data, never of returns or model error.
    arima_orders: p in 0..2, d = 0, q in 0..2
    arima_criterion: lowest_aic_on_training_returns
    arima_d_justification: ADF rejects unit root on returns for 10/10 tickers
    refit_every_n_sessions: 21
    prophet_target: log_price                    # converted to implied return

  baselines:
    - zero            # unconditional mean of returns; the honest reference
    - naive_persistence

robustness:
  dimensions:
    - trailing_volatility_terciles    # cut on vol_21, itself a trailing feature
    - ticker_tweet_volume_terciles    # cut on training-window volume
    - forecast_horizon                # 1d vs 3d
  note: >
    Subgroups share underlying observations and are not independent tests.
    The 6-of-20 significance count is suggestive, not a formal
    multiple-testing result.

reproducibility:
  seed: 42
  requirements: requirements.txt
  tests: 22            # python3 -m pytest tests/ -q
